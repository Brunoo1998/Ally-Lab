name: Validación de Ally Lab
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sintaxis JavaScript
        run: |
          for file in dist/app.js dist/capturas.js dist/lab-controls.js dist/ally-ai.js dist/sim-model.js dist/simulador.js dist/sim-chart.js dist/ports.js; do node --check "$file"; done
      - name: Simulador FPS y Ally AI
        run: |
          node tools/probar_simulador.mjs
          node tools/probar_ally_ai.mjs
          node --check dist/pwa.js
          node --check dist/sw.js
          node --check dist/buscar.js
          node --check dist/buscar-launch.js
          node --check dist/lab-account.js
          node --check functions/api/lab-account.js
          node tools/probar_cuenta.mjs
          node tools/generar_guias.mjs
