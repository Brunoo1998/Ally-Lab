name: Auditoría funcional pública
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/probar_publicacion.mjs'
      - 'tools/probar_navegador.mjs'
      - '.github/workflows/auditoria-publica.yml'
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/probar_publicacion.mjs
      - name: Instalar Chromium de pruebas
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: node tools/probar_navegador.mjs
